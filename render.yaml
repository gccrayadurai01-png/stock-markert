services:
  - type: web
    name: trading-brain-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: PORT
        value: 10000
      - key: ANTHROPIC_API_KEY
        sync: false          # You will paste this in Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.0
